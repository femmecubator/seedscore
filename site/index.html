<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seedscore v2 (Impact Scorecard)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #185FA5;
            --secondary: #0C447C;
            --accent-human: #1D9E75;
            --accent-systems: #D85A30;
            --accent-env: #639922;
            --neutral: #888780;
            --bg-primary: #ffffff;
            --bg-secondary: #F1EFE8;
            --bg-tertiary: #EEEDFE;
            --border: #D3D1C7;
            --text-primary: #2C2C2A;
            --text-secondary: #5F5E5A;
            --text-light: #B4B2A9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 16px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* ---- Multi-project sidebar ---- */
        :root { --sidebar-w: 260px; }
        #sidebarToggle {
            position: fixed; top: 12px; left: 12px; z-index: 1100;
            width: 40px; height: 40px; font-size: 18px; cursor: pointer;
            background: var(--primary); color: #fff; border: none; border-radius: 6px;
        }
        #sidebar {
            position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
            background: var(--bg-primary); border-right: 1px solid var(--border);
            padding: 16px 12px; overflow-y: auto; z-index: 1090;
            transform: translateX(-100%); transition: transform .2s ease;
        }
        #sidebar.open { transform: translateX(0); box-shadow: 0 0 30px rgba(0,0,0,.18); }
        #sidebar h2 { font-size: 15px; margin-bottom: 12px; }
        #newProjectBtn {
            width: 100%; padding: 10px; margin-bottom: 14px; cursor: pointer;
            background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600;
        }
        .proj-item {
            padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
            margin-bottom: 8px; cursor: pointer; background: var(--bg-secondary);
        }
        .proj-item.active { border-color: var(--primary); background: var(--bg-tertiary); }
        .proj-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .proj-meta { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
        .badge { font-size: 11px; padding: 2px 6px; border-radius: 10px; background: var(--neutral); color: #fff; }
        .badge.done { background: var(--accent-human); }
        .score-chip { font-size: 11px; padding: 2px 6px; border-radius: 10px; background: var(--primary); color: #fff; }
        .proj-actions { display: flex; gap: 6px; margin-top: 8px; }
        .proj-actions button {
            font-size: 11px; padding: 3px 6px; cursor: pointer;
            border: 1px solid var(--border); border-radius: 5px; background: var(--bg-primary);
        }
        .proj-actions button.del { color: #b3261e; }
        @media (max-width: 1023px) {
            /* hamburger is fixed top-left; push content + sidebar heading down so it doesn't overlap */
            body { padding-top: 64px; }
            #sidebar { padding-top: 64px; }
        }
        @media (min-width: 1024px) {
            #sidebar { transform: translateX(0); }
            #sidebarToggle { display: none; }
            body { padding-left: calc(var(--sidebar-w) + 16px); }
        }
        @media print {
            #sidebar, #sidebarToggle { display: none !important; }
            body { padding-left: 16px; }
        }

        header {
            text-align: center;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            padding: 12px 20px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        /* Panels */
        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.1);
        }

        /* Question Card */
        .question-card {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 28px;
            margin-bottom: 24px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .question-header {
            margin-bottom: 20px;
        }

        .progress-bar {
            background: var(--bg-secondary);
            height: 4px;
            border-radius: 2px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .progress-fill {
            background: var(--primary);
            height: 100%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .question-title {
            font-size: 18px;
            font-weight: 600;
            margin-top: 12px;
            line-height: 1.4;
        }

        .question-context {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 12px;
            font-style: italic;
            padding: 12px;
            background: var(--bg-tertiary);
            border-left: 3px solid var(--neutral);
            border-radius: 4px;
        }

        /* Radio Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-primary);
        }

        .option-label:hover {
            background: var(--bg-tertiary);
            border-color: var(--primary);
        }

        .option-label.survey-option {
            padding: 16px;
            flex-direction: column;
            align-items: flex-start;
            border: 2px solid var(--border);
            gap: 0;
        }

        .option-label.survey-option:hover {
            border-color: var(--primary);
            background: var(--bg-tertiary);
        }

        .option-label.survey-option input[type="radio"] {
            margin-bottom: 8px;
            margin-right: 0;
        }

        input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        /* Navigation */
        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            padding: 10px 24px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--bg-secondary);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--secondary);
            border-color: var(--secondary);
        }

        .btn-export {
            background: var(--accent-human);
            color: white;
            border-color: var(--accent-human);
            padding: 10px 20px;
        }

        .btn-export:hover {
            background: #159b6f;
        }

        /* Dashboard Styles */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .score-card {
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .score-card.human {
            border-top-color: var(--accent-human);
            border-top-width: 4px;
        }

        .score-card.systems {
            border-top-color: var(--accent-systems);
            border-top-width: 4px;
        }

        .score-card.environment {
            border-top-color: var(--accent-env);
            border-top-width: 4px;
        }

        .score-value {
            font-size: 32px;
            font-weight: 700;
            margin: 8px 0;
        }

        .score-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .score-subtitle {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 8px;
        }

        .breakdown-title {
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .breakdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            font-size: 13px;
        }

        .breakdown-bar {
            flex: 1;
            height: 6px;
            background: var(--bg-secondary);
            border-radius: 3px;
            overflow: hidden;
        }

        .breakdown-bar-fill {
            height: 100%;
        }

        .env-metrics {
            display: flex;
            gap: 16px;
            margin-top: 24px;
        }

        .metric-box {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .metric-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .comparison {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-top: 24px;
        }

        .comparison-title {
            font-weight: 600;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .comparison-item {
            margin-bottom: 20px;
        }

        .comparison-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .comparison-bar {
            height: 32px;
            background: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .comparison-value {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Report Styles */
        .report {
            background: var(--bg-primary);
            padding: 32px;
            border-radius: 8px;
            line-height: 1.8;
            color: var(--text-primary);
        }

        .report h2 {
            font-size: 20px;
            margin-top: 24px;
            margin-bottom: 12px;
            color: var(--primary);
            font-weight: 600;
        }

        .report h2:first-child {
            margin-top: 0;
        }

        .report p {
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .report ul {
            font-size: 14px;
        }

        .report-metrics {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .export-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }

        @media (max-width: 768px) {
            h1 { font-size: 22px; }
            .tabs {
                flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .tab-btn {
                padding: 10px 14px;
                white-space: nowrap;
            }
            .dashboard {
                grid-template-columns: 1fr;
            }

            .env-metrics {
                flex-direction: column;
            }

            .report-metrics {
                flex-direction: column;
            }

            .comparison-bar {
                width: 100%;
            }

            .question-card {
                padding: 20px;
            }
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .tabs,
            .navigation,
            .btn,
            .export-section {
                display: none;
            }

            .report {
                box-shadow: none;
                border: none;
            }
        }
    </style>
</head>
<body>
    <button id="sidebarToggle" onclick="toggleSidebar()" aria-label="Toggle projects">☰</button>
    <aside id="sidebar">
        <h2>Projects</h2>
        <button id="newProjectBtn" onclick="newProject()">+ New Project</button>
        <div id="projectList"></div>
    </aside>
    <div class="container">
        <header>
            <h1>Seedscore v2 (Impact Scorecard)</h1>
            <p class="subtitle">Measure the three-pillar impact of your AI projects (Human • Systems • Environment)</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('project')">Project Setup</button>
            <button class="tab-btn" onclick="switchTab('assessment')">Assessment</button>
            <button class="tab-btn" onclick="switchTab('dashboard')">Dashboard</button>
            <button class="tab-btn" onclick="switchTab('report')">Report</button>
        </div>

        <!-- Project Setup Tab -->
        <div id="project" class="tab-panel active">
            <div class="question-card">
                <div class="question-header">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 100%;"></div>
                    </div>
                    <p class="progress-text">Project Details</p>
                </div>

                <h2 class="question-title">Tell us about your project</h2>

                <div class="form-group">
                    <label for="projectName">Project Name</label>
                    <input type="text" id="projectName" placeholder="e.g., Customer Service Chatbot">
                </div>

                <div class="form-group">
                    <label for="projectDesc">Description</label>
                    <input type="text" id="projectDesc" placeholder="Brief description of your AI project">
                </div>

                <div class="form-group">
                    <label for="llmModel">LLM Model Used</label>
                    <!-- Options populated from the MODELS source-of-truth (see script). -->
                    <select id="llmModel"></select>
                </div>

                <div class="form-group">
                    <label for="teamSize">Team Size (people)</label>
                    <input type="number" id="teamSize" placeholder="5" value="5" min="1">
                </div>

                <div class="form-group">
                    <label for="projectDays">Project Duration (days)</label>
                    <input type="number" id="projectDays" placeholder="30" value="30" min="1">
                </div>

                <div class="form-group">
                    <label for="inferenceCalls">Est. Inference Calls (30 days)</label>
                    <input type="number" id="inferenceCalls" placeholder="10000" value="10000" min="0">
                </div>

                <div class="form-group">
                    <label for="apiCost">Est. API Cost</label>
                    <input type="text" id="apiCost" placeholder="$1,500">
                </div>

                <div class="form-group">
                    <label for="outcomes">Key Outcomes / Deliverables</label>
                    <input type="text" id="outcomes" placeholder="e.g., 40% reduction in support tickets, faster issue resolution">
                </div>

                <div class="navigation">
                    <button class="btn" onclick="switchTab('project')" style="visibility: hidden;">← Back</button>
                    <button class="btn btn-primary" onclick="switchTab('assessment')">Continue →</button>
                </div>
            </div>
        </div>

        <!-- Assessment Tab -->
        <div id="assessment" class="tab-panel">
            <div id="assessmentContent"></div>
            <div class="navigation">
                <button class="btn" onclick="previousQuestion()">← Back</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Next →</button>
            </div>
        </div>

        <!-- Dashboard Tab -->
        <div id="dashboard" class="tab-panel">
            <div id="dashboardContent"></div>
            <div class="navigation">
                <button class="btn" onclick="switchTab('assessment')">← Back</button>
                <button class="btn btn-primary" onclick="switchTab('report')">View Report →</button>
            </div>
        </div>

        <!-- Report Tab -->
        <div id="report" class="tab-panel">
            <div id="reportContent"></div>
            <div class="navigation">
                <button class="btn" onclick="switchTab('dashboard')">← Back</button>
            </div>
        </div>
    </div>

    <script>
        // Single source of truth for LLM models. Drives the Project-setup dropdown,
        // the Dashboard/Report CO2 estimate, and must stay in sync with
        // DATA_SCHEMA-0601-.json (schema.Project.llmModel.enum + emissionsData.models).
        // emissionsPerToken = kg CO2 per token. Small-model values are size-based
        // estimates; large-model values match the schema's published figures.
        const MODELS = [
            { name: 'Claude 3.5 Sonnet', provider: 'Anthropic', emissionsPerToken: 0.0000138, size: 'large' },
            { name: 'Claude 3 Opus',     provider: 'Anthropic', emissionsPerToken: 0.0000142, size: 'large' },
            { name: 'Claude Haiku 4.5',  provider: 'Anthropic', emissionsPerToken: 0.0000045, size: 'small' },
            { name: 'GPT-4',             provider: 'OpenAI',    emissionsPerToken: 0.0000195, size: 'large' },
            { name: 'GPT-4 Turbo',       provider: 'OpenAI',    emissionsPerToken: 0.0000180, size: 'large' },
            { name: 'Gemini Pro',        provider: 'Google',    emissionsPerToken: 0.0000120, size: 'large' },
            { name: 'Llama 2',           provider: 'Meta',      emissionsPerToken: 0.0000110, size: 'medium' },
            { name: 'Qwen 8B',           provider: 'Alibaba',   emissionsPerToken: 0.0000030, size: 'small' },
            { name: 'SmolLM',            provider: 'Hugging Face', emissionsPerToken: 0.0000008, size: 'small' },
            { name: 'Other',             provider: 'Unknown',   emissionsPerToken: 0.0000140, size: 'unknown' }
        ];

        // kg CO2 per token for a model name; falls back to the "Other" default.
        function emissionsForModel(name) {
            const m = MODELS.find(x => x.name === name);
            return m ? m.emissionsPerToken : 0.0000140;
        }

        // Build the model dropdown from MODELS (no hardcoded <option> list in HTML).
        function populateModelDropdown() {
            const sel = document.getElementById('llmModel');
            if (!sel) return;
            sel.innerHTML = MODELS
                .map(m => `<option value="${m.name}">${m.name}${m.size === 'small' ? ' (small)' : ''}</option>`)
                .join('');
        }

        // Assessment Questions
        const questions = [
            {
                id: 'q1_core_purpose',
                category: 'human',
                title: 'Is the solution still aligned with the civic problem it was designed to solve, and can participants articulate why this work matters to their community?',
                context: 'Strong projects maintain their original purpose and community understanding.',
                options: [
                    { value: 0, label: 'Solution has drifted; participants cannot articulate community context' },
                    { value: 1, label: 'Partial alignment with some community understanding' },
                    { value: 2, label: 'Strong alignment; participants clearly understand community impact' }
                ]
            },
            {
                id: 'q2_uplift_skilling',
                category: 'human',
                title: 'Did building this tool expand participants\' capabilities and was compensation fair with knowledge-sharing encouraged?',
                context: 'Projects should grow capabilities and support equitable collaboration.',
                options: [
                    { value: 0, label: 'Limited capability growth; unfair compensation or isolated work' },
                    { value: 1, label: 'Some capability development; partial compensation with some knowledge-sharing' },
                    { value: 2, label: 'Significant capability expansion; fair compensation with knowledge-sharing' }
                ]
            },
            {
                id: 'q3_cognitive_autonomy',
                category: 'human',
                title: 'Does the team maintain cognitive autonomy, able to explain decisions without relying on AI to regenerate explanations?',
                context: 'Teams should own and understand their technical decisions.',
                options: [
                    { value: 0, label: 'Significant cognitive debt; team relies on AI for explanations' },
                    { value: 1, label: 'Partial understanding; some reliance on AI for technical explanations' },
                    { value: 2, label: 'Full cognitive autonomy; team can explain all decisions independently' }
                ]
            },
            {
                id: 'q4_creative_agency',
                category: 'human',
                title: 'Did participants make deliberate choices about tools and approaches, or default to AI suggestions?',
                context: 'Human judgment should guide tool selection and decision-making.',
                options: [
                    { value: 0, label: 'Defaulted to AI suggestions with minimal deliberate choice' },
                    { value: 1, label: 'Some deliberate choices mixed with reliance on AI defaults' },
                    { value: 2, label: 'Participants made deliberate, informed choices about tools and approaches' }
                ]
            },
            {
                id: 'q5_human_judgment',
                category: 'human',
                title: 'Is there documented evidence that human judgment was exercised, including moments where AI recommendations were overridden?',
                context: 'Exercised judgment and override moments demonstrate genuine human agency.',
                options: [
                    { value: 0, label: 'No evidence of judgment; AI recommendations were followed without question' },
                    { value: 1, label: 'Some instances of human judgment; occasional overrides noted' },
                    { value: 2, label: 'Clear evidence of exercised judgment with documented override moments' }
                ]
            },
            {
                id: 'q6_reusability_commons',
                category: 'systems',
                title: 'Is the code, design, and learnings documented and shareable so others can adopt or adapt without starting from scratch?',
                context: 'Reusable, well-documented systems reduce future effort and benefit the broader community.',
                options: [
                    { value: 0, label: 'Code is undocumented; learnings are isolated or unpublished' },
                    { value: 1, label: 'Some documentation exists; learnings partially shared' },
                    { value: 2, label: 'Well-documented with published learnings that others can build upon' }
                ]
            },
            {
                id: 'q7_quality_harms',
                category: 'systems',
                title: 'Were sufficient testing and edge case coverage completed before deployment, and are real-world harms understood and documented?',
                context: 'Rigorous testing and harm documentation are essential, especially in civic contexts.',
                options: [
                    { value: 0, label: 'Minimal testing; harms not documented or understood' },
                    { value: 1, label: 'Some testing completed; partial harm documentation' },
                    { value: 2, label: 'Comprehensive testing; harms clearly identified and documented' }
                ]
            },
            {
                id: 'q8_corporate_autonomy',
                category: 'systems',
                title: 'Does the project avoid vendor lock-in and does the community retain meaningful control and autonomy over the tools?',
                context: 'Community control and platform independence protect against unexpected changes.',
                options: [
                    { value: 0, label: 'High vendor lock-in; limited community control' },
                    { value: 1, label: 'Some independence; partial community control' },
                    { value: 2, label: 'Strong independence; community retains full autonomy' }
                ]
            },
            {
                id: 'q9_maintenance_resilience',
                category: 'systems',
                title: 'Is there a maintenance plan and documentation sufficient for the tool to survive and evolve without original builders?',
                context: 'Tools built for longevity require robust documentation and transition planning.',
                options: [

                    { value: 1, label: 'Partial accounting; some resource costs considered' },

            {
                id: 'q14_environmental_transparency',

        let currentQuestion = 0;
        // No pre-filled answers. Responses start empty so validation is real and
        // the Dashboard/Report only reflect what the user actually answered.
        let responses = {};

        // True only when every question Q1-Q15 has a saved response.
        function allAnswered() {
            return questions.every(q => responses[q.id] !== undefined);
        }

        // How many of the 15 questions are answered so far.
        function answeredCount() {
            return questions.filter(q => responses[q.id] !== undefined).length;
        }

        function togglePillars() {
            const content = document.getElementById('pillarsContent');
            const chevron = document.getElementById('pillarsChevron');
            
            if (content.style.display === 'none') {
                content.style.display = 'grid';
                chevron.style.transform = 'rotate(0deg)';
            } else {
                content.style.display = 'none';
                chevron.style.transform = 'rotate(-90deg)';
            }
        }

        function switchTab(tabName) {
            // Gate the scored views: Dashboard and Report require all 15 answers.
            // Redirect to the assessment with a notice instead of showing partial/empty scores.
            let pendingNotice = '';
            if ((tabName === 'dashboard' || tabName === 'report') && !allAnswered()) {
                pendingNotice = `Answer all ${questions.length} questions before viewing the ${tabName === 'dashboard' ? 'Dashboard' : 'Report'} — ${answeredCount()} of ${questions.length} answered.`;
                tabName = 'assessment';
            }

            // Hide all panels
            document.querySelectorAll('.tab-panel').forEach(panel => {
                panel.classList.remove('active');
            });
            // Highlight the matching tab button by target name (no reliance on event.target).
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                const oc = btn.getAttribute('onclick') || '';
                if (oc.includes(`'${tabName}'`)) btn.classList.add('active');
            });

            // Show selected panel
            document.getElementById(tabName).classList.add('active');

            // Generate content for specific tabs
            if (tabName === 'assessment') {
                renderQuestion();
            } else if (tabName === 'dashboard') {
                renderDashboard();
            } else if (tabName === 'report') {
                renderReport();
            }

            if (pendingNotice) showAssessmentNotice(pendingNotice);
        }

        // Show a non-blocking inline validation message inside the assessment panel.
        function showAssessmentNotice(msg) {
            const el = document.getElementById('assessmentNotice');
            if (!el) return;
            el.textContent = msg;
            el.style.display = 'block';
        }

        function clearAssessmentNotice() {
            const el = document.getElementById('assessmentNotice');
            if (el) el.style.display = 'none';
        }

        function renderQuestion() {
            if (currentQuestion >= questions.length) {
                switchTab('dashboard');
                return;
            }

            const question = questions[currentQuestion];
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            const category = question.category;
            const categoryLabel = category.charAt(0).toUpperCase() + category.slice(1);

            let html = `
                <div class="question-card">
                    <div class="question-header">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%;"></div>
                        </div>
                        <p class="progress-text">Question ${currentQuestion + 1} of ${questions.length}</p>
                    </div>

                    <div style="margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);">
                        <div style="font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">
                            ${categoryLabel} Impact
                        </div>
                        <h2 class="question-title">${question.title}</h2>
                    </div>

                    <div class="options">
            `;

            question.options.forEach((option, index) => {
                const checked = responses[question.id] == option.value ? 'checked' : '';
                const optionLabels = ['Not Met', 'Partially Met', 'Met'];
                const optionLabel = optionLabels[option.value] || option.label;
                
                html += `
                    <label class="option-label survey-option">
                        <input type="radio" name="q${currentQuestion}" value="${option.value}" ${checked} 
                               onchange="saveResponse('${question.id}', ${option.value})">
                        <div style="flex: 1;">
                            <div style="font-weight: 500; margin-bottom: 4px;">${optionLabel}</div>
                            <div style="font-size: 13px; color: var(--text-secondary);">${option.label}</div>
                        </div>
                    </label>
                `;
            });

            html += '</div>';
            html += `
                    <div id="assessmentNotice" role="alert" style="display: none; margin-top: 16px; padding: 10px 14px; border-radius: 6px; background: #fdecea; color: #b3261e; font-size: 13px; font-weight: 500;"></div>
                </div>`;

            document.getElementById('assessmentContent').innerHTML = html;

            // Update button state
            document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? 'Finish →' : 'Next →';
        }

        function saveResponse(questionId, value) {
            responses[questionId] = value;
            clearAssessmentNotice();
            autoSave();
        }

        function nextQuestion() {
            if (responses[questions[currentQuestion].id] === undefined) {
                showAssessmentNotice('Please answer this question before continuing.');
                return;
            }
            currentQuestion++;
            autoSave();
            if (currentQuestion >= questions.length) {
                // All answered — switchTab gate will allow the Dashboard.
                switchTab('dashboard');
            } else {
                renderQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                autoSave();
                renderQuestion();
            }
        }

        function calculateScores(resp) {
            resp = resp || responses;
            const categories = {
                human: { questions: ['q1_core_purpose', 'q2_uplift_skilling', 'q3_cognitive_autonomy', 'q4_creative_agency', 'q5_human_judgment'], values: [] },
                systems: { questions: ['q6_reusability_commons', 'q7_quality_harms', 'q8_corporate_autonomy', 'q9_maintenance_resilience', 'q10_resilience_longevity'], values: [] },
                environment: { questions: ['q11_carbon_tracking', 'q12_model_inference', 'q13_full_resource_accounting', 'q14_environmental_transparency', 'q15_mitigation_strategy'], values: [] }
            };

            for (let cat in categories) {
                categories[cat].questions.forEach(q => {
                    if (resp[q] !== undefined) {
                        categories[cat].values.push(resp[q]);
                    }
                });
                categories[cat].avg = categories[cat].values.length > 0 
                    ? categories[cat].values.reduce((a, b) => a + b, 0) / categories[cat].values.length 
                    : 0;
            }

            return categories;
        }

            let interpretation = '';
            if (overallScore >= 1.5) {
                interpretation = 'This project demonstrates strong impact across human, systems, and environmental dimensions. The integration of AI is thoughtful, sustainable, and beneficial.';

                interpretation = 'This project shows balanced impact with some areas of strength and opportunity for improvement. Consider addressing the lower-scoring dimensions.';

                interpretation = 'This project would benefit from closer alignment with impact principles. Review opportunities to enhance human agency, system resilience, and environmental efficiency.';

                    <h2>Impact Assessment Report</h2>

                    <div class="report-metrics">
                        <div style="text-align: center;">
                            <div style="font-size: 28px; font-weight: 700; color: var(--accent-human); margin-bottom: 4px;">${scores.human.avg.toFixed(1)}</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">Human Impact</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="font-size: 28px; font-weight: 700; color: var(--accent-systems); margin-bottom: 4px;">${scores.systems.avg.toFixed(1)}</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">Systems Impact</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="font-size: 28px; font-weight: 700; color: var(--accent-env); margin-bottom: 4px;">${scores.environment.avg.toFixed(1)}</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">Environment</div>
                        </div>
                    </div>

                    <h2>Key Findings</h2>
                    <p><strong>Human Impact:</strong> Project scored ${scores.human.avg.toFixed(1)}/2.0. Focus areas: core purpose alignment, skill uplift, cognitive sovereignty.</p>
                    <p><strong>Systems Impact:</strong> Project scored ${scores.systems.avg.toFixed(1)}/2.0. Key considerations: speed/cost tradeoff, quality assurance, vendor resilience.</p>
                    <p><strong>Environmental Impact:</strong> Project scored ${scores.environment.avg.toFixed(1)}/2.0. Estimated CO₂ footprint: ${estimatedCO2kg} kg over 30 days.</p>

                    <h2>Operational Metrics</h2>
                    <ul style="margin-left: 20px; color: var(--text-secondary); font-size: 14px;">
                        <li>API Calls (30 days): ${inferenceCalls.toLocaleString()}</li>
                        <li>Estimated Cost: ${apiCost}</li>
                        <li>Outcomes: ${outcomes}</li>
                        <li>Estimated CO₂: ${estimatedCO2kg} kg</li>
                    </ul>

                    <h2>Recommendations</h2>
                    <ul style="margin-left: 20px; color: var(--text-secondary); font-size: 14px;">
                        ${scores.human.avg < 1.5 ? '<li>Strengthen human agency: Review decision-making processes to ensure AI augments rather than replaces judgment.</li>' : ''}
                        ${scores.systems.avg < 1.5 ? '<li>Improve system resilience: Reduce vendor lock-in and document failure modes.</li>' : ''}
                        ${scores.environment.avg < 1.5 ? '<li>Optimize environmental footprint: Consider smaller models, batch processing, or offset programs.</li>' : ''}
                        <li>Document this assessment and share findings with stakeholders for transparency.</li>
                        <li>Plan quarterly reassessments to track progress on recommendations.</li>
                    </ul>

                    <h2>How to Share & Replicate</h2>
                    <p>This assessment is designed to be reproducible and comparable. Share this report with others to:</p>
                    <ul style="margin-left: 20px; color: var(--text-secondary); font-size: 14px;">
                        <li>Benchmark against similar projects</li>
                        <li>Identify best practices in your industry</li>
                        <li>Build a collective understanding of AI impact</li>
                        <li>Inform organizational policy and governance</li>
                    </ul>

                    <div class="export-section">
                        <button class="btn-export" onclick="exportReport()">📥 Export as JSON</button>
                        <button class="btn-export" onclick="printReport()" style="background: var(--neutral); border-color: var(--neutral); margin-left: 12px;">🖨️ Print Report</button>
                    </div>
                </div>
            `;

            document.getElementById('reportContent').innerHTML = html;
        }

        // ---- Multi-project model + persistence ----
        // Maps project-object keys to the Project-setup form input ids.
        const FIELD_IDS = {
            name: 'projectName', description: 'projectDesc', llmModel: 'llmModel',
            teamSize: 'teamSize', projectDays: 'projectDays',
            inferenceCalls: 'inferenceCalls', apiCost: 'apiCost', outcomes: 'outcomes'
        };

        // Persistence layer. localStorage-backed today; swap this object's body for
        // Formulize API calls later (see docs/plans/2026-06-26-multiproject-formulize-design.md)
        // without touching the UI/wiring above.

        // ---- Formulize backend config ----
        // localStorage stays the synchronous source of truth (offline-first). When
        // enabled, Sync mirrors writes to Formulize through the PHP proxy and pulls
        // remote state on load (last-write-wins by updatedAt). No instance yet, so
        // this is OFF by default. To turn on: deploy site/api/seedscore-proxy.php on
        // the Formulize host, build the two forms, then set enabled+proxyUrl+token.
        // See docs/plans/2026-06-29-formulize-proxy-integration.md.
        const CONFIG = {
            formulize: {
                enabled: false,
                proxyUrl: '',   // e.g. https://forms.example.org/seedscore-proxy.php
                token: ''       // must match SEEDSCORE_TOKEN in the proxy
            }
        };

        // App project object -> Formulize project-form handles (design §2).
        // responses keys (q1_core_purpose ...) are already the radio handles 1:1.
        function toProjectFields(p) {
            return Object.assign({
                name: p.name, description: p.description, llm_model: p.llmModel,
                team_size: p.teamSize, project_days: p.projectDays,
                inference_calls: p.inferenceCalls, api_cost: p.apiCost,
                outcomes: p.outcomes, created_at: p.createdAt, updated_at: p.updatedAt
            }, p.responses || {});
        }

        // App project -> Formulize report-form handles (design §2).
        function toReportFields(p) {
            const r = buildReportObject(p);
            const total = ((Number(r.scores.human) + Number(r.scores.systems) +
                Number(r.scores.environment)) / 3).toFixed(2);
            return {
                fields: {
                    score_human: r.scores.human, score_systems: r.scores.systems,
                    score_environment: r.scores.environment, score_total: total,
                    co2_kg: r.co2_kg, generated_at: r.generatedAt
                },
                snapshot: r
            };
        }

        // Background mirror to Formulize. All methods no-op when disabled.
        const Sync = {
            on() { return CONFIG.formulize.enabled && CONFIG.formulize.proxyUrl; },
            _url(action) { return CONFIG.formulize.proxyUrl + '?action=' + action; },
            _headers() {
                return { 'Content-Type': 'application/json',
                         'X-Seedscore-Token': CONFIG.formulize.token };
            },
            _pushTimers: {},
            push(project) {
                if (!this.on() || !project || !project.id) return;
                // Coalesce bursts of edits per project.
                clearTimeout(this._pushTimers[project.id]);
                this._pushTimers[project.id] = setTimeout(() => {
                    const report = toReportFields(project);
                    fetch(this._url('save'), {
                        method: 'POST', headers: this._headers(),
                        body: JSON.stringify({
                            app_id: project.id,
                            project_fields: toProjectFields(project),
                            project_payload: project,
                            report_fields: report.fields,
                            report_snapshot: report.snapshot
                        })
                    }).catch(e => console.warn('Formulize push failed:', e));
                }, 800);
            },
            remove(id) {
                if (!this.on() || !id) return;
                fetch(this._url('remove'), {
                    method: 'POST', headers: this._headers(),
                    body: JSON.stringify({ app_id: id })
                }).catch(e => console.warn('Formulize remove failed:', e));
            },
            // Hydrate localStorage from Formulize before the UI reads it.
            // Writes directly via Store._write to avoid re-triggering push.
            pull() {
                if (!this.on()) return Promise.resolve();
                return fetch(this._url('list'), { headers: this._headers() })
                    .then(r => r.ok ? r.json() : Promise.reject(r.status))
                    .then(data => {
                        const remote = (data && data.projects) || [];
                        const byId = {};
                        Store._read().forEach(p => { byId[p.id] = p; });
                        remote.forEach(rp => {
                            const lp = byId[rp.id];
                            if (!lp || new Date(rp.updatedAt || 0) > new Date(lp.updatedAt || 0)) {
                                byId[rp.id] = rp;
                            }
                        });
                        Store._write(Object.values(byId));
                    })
                    .catch(e => console.warn('Formulize pull failed:', e));
            }
        };

        const Store = {
            KEY: 'seedscore_projects',
            ACTIVE: 'seedscore_active',
            _read() { try { return JSON.parse(localStorage.getItem(this.KEY)) || []; } catch (e) { return []; } },
            _write(a) { localStorage.setItem(this.KEY, JSON.stringify(a)); },
            list() { return this._read(); },
            load(id) { return this._read().find(p => p.id === id) || null; },
            save(project) {
                const a = this._read();
                const i = a.findIndex(p => p.id === project.id);
                project.updatedAt = new Date().toISOString();
                if (i >= 0) a[i] = project; else a.push(project);
                this._write(a);
                Sync.push(project);
                return project.id;
            },
            remove(id) { this._write(this._read().filter(p => p.id !== id)); Sync.remove(id); },
            activeId() { return localStorage.getItem(this.ACTIVE); },
            setActive(id) { localStorage.setItem(this.ACTIVE, id); }
        };

        let activeProjectId = null;

        function blankProject() {
            const now = new Date().toISOString();
            return {
                id: 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                name: '', description: '', llmModel: (MODELS[0] || {}).name || '',
                teamSize: 5, projectDays: 30, inferenceCalls: 10000, apiCost: '', outcomes: '',
                responses: {}, currentQuestion: 0, createdAt: now, updatedAt: now
            };
        }

        // DOM + globals (responses, currentQuestion) -> project object.
        function readForm() {
            const base = Store.load(activeProjectId) || blankProject();
            base.id = activeProjectId || base.id;
            for (const k in FIELD_IDS) {
                const el = document.getElementById(FIELD_IDS[k]);
                if (el) base[k] = el.value;
            }
            base.responses = responses;
            base.currentQuestion = currentQuestion;
            return base;
        }

        // project object -> DOM + globals.
        function writeForm(project) {
            for (const k in FIELD_IDS) {
                const el = document.getElementById(FIELD_IDS[k]);
                if (el) el.value = project[k] != null ? project[k] : '';
            }
            responses = project.responses || {};
            currentQuestion = project.currentQuestion || 0;
        }

        let _saveTimer = null;
        function autoSave() {
            clearTimeout(_saveTimer);
            _saveTimer = setTimeout(() => {
                if (!activeProjectId) return;
                Store.save(readForm());
                renderSidebar();
            }, 300);
        }

        function attachAutoSave() {
            Object.values(FIELD_IDS).forEach(fid => {
                const el = document.getElementById(fid);
                if (el) { el.addEventListener('input', autoSave); el.addEventListener('change', autoSave); }
            });
        }

        function newProject() {
            if (activeProjectId) Store.save(readForm());
            const p = blankProject();
            Store.save(p);
            activeProjectId = p.id;
            Store.setActive(p.id);
            writeForm(p);
            renderSidebar();
            switchTab('project');
            closeSidebarMobile();
        }

        function selectProject(id) {
            if (id === activeProjectId) { switchTab('project'); closeSidebarMobile(); return; }
            if (activeProjectId) Store.save(readForm());
            const p = Store.load(id);
            if (!p) return;
            activeProjectId = id;
            Store.setActive(id);
            writeForm(p);
            renderSidebar();
            switchTab('project');
            closeSidebarMobile();
        }

        function deleteProject(id, ev) {
            if (ev) ev.stopPropagation();
            if (!confirm('Delete this project? This cannot be undone.')) return;
            Store.remove(id);
            let list = Store.list();
            if (id === activeProjectId) {
                if (!list.length) { const p = blankProject(); Store.save(p); list = [p]; }
                activeProjectId = list[0].id;
                Store.setActive(activeProjectId);
                writeForm(list[0]);
                switchTab('project');
            }
            renderSidebar();
        }

        // Answered count + total avg score (0-2.0) for a stored project.
        function projectScoreInfo(p) {
            const total = questions.length;
            const resp = p.responses || {};
            const answered = questions.filter(q => resp[q.id] !== undefined).length;
            let scoreTotal = null;
            if (answered === total) {
                const sum = questions.reduce((a, q) => a + Number(resp[q.id] || 0), 0);
                scoreTotal = (sum / total).toFixed(1);
            }
            return { answered, total, scoreTotal };
        }

        function renderSidebar() {
            const el = document.getElementById('projectList');
            if (!el) return;
            const list = Store.list();
            if (!list.length) {
                el.innerHTML = '<p style="font-size:13px;color:var(--text-secondary);">No projects yet.</p>';
                return;
            }
            el.innerHTML = list.map(p => {
                const { answered, total, scoreTotal } = projectScoreInfo(p);
                const active = p.id === activeProjectId ? ' active' : '';
                const name = (p.name || 'Untitled project').replace(/</g, '&lt;');
                const doneCls = answered === total ? ' done' : '';
                const chip = scoreTotal !== null ? `<span class="score-chip">${scoreTotal}/2.0</span>` : '';
                return `
                    <div class="proj-item${active}" onclick="selectProject('${p.id}')">
                        <div class="proj-name">${name}</div>
                        <div class="proj-meta">
                            <span class="badge${doneCls}">${answered}/${total}</span>
                            ${chip}
                        </div>
                        <div class="proj-actions">
                            <button onclick="exportProjectJSON('${p.id}', event)">JSON</button>
                            <button onclick="exportProjectPDF('${p.id}', event)">PDF</button>
                            <button class="del" onclick="deleteProject('${p.id}', event)">Delete</button>
                        </div>
                    </div>`;
            }).join('');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
        function closeSidebarMobile() {
            if (window.matchMedia('(max-width: 1023px)').matches) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        // ---- Export (per project) ----
        function buildReportObject(p) {
            const scores = calculateScores(p.responses || {});
            const inferenceCalls = parseInt(p.inferenceCalls) || 0;
            const co2kg = ((inferenceCalls * 1200 * emissionsForModel(p.llmModel)) / 1000).toFixed(3);
            return {
                project: {
                    id: p.id, name: p.name, description: p.description, llmModel: p.llmModel,
                    inferenceCalls, apiCost: p.apiCost, teamSize: parseInt(p.teamSize) || 0,
                    duration: parseInt(p.projectDays) || 0, outcomes: p.outcomes
                },
                scores: {
                    human: scores.human.avg.toFixed(2),
                    systems: scores.systems.avg.toFixed(2),
                    environment: scores.environment.avg.toFixed(2)
                },
                co2_kg: co2kg,
                responses: p.responses || {},
                generatedAt: new Date().toISOString()
            };
        }

        function exportProjectJSON(id, ev) {
            if (ev) ev.stopPropagation();
            if (id === activeProjectId) Store.save(readForm());
            const p = Store.load(id);
            if (!p) return;
            const data = JSON.stringify(buildReportObject(p), null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `seedscore-${(p.name || 'project').replace(/\s+/g, '-').toLowerCase()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function exportProjectPDF(id, ev) {
            if (ev) ev.stopPropagation();
            selectProject(id);
            if (!allAnswered()) {
                alert('Answer all ' + questions.length + ' questions before exporting this project’s report PDF.');
                return;
            }
            switchTab('report');
            setTimeout(() => window.print(), 200);
        }

        // Report-tab buttons act on the active project.
        function exportReport() { exportProjectJSON(activeProjectId); }
        function printReport() { window.print(); }

        // ---- Initialize ----
        function initProjects() {
            let list = Store.list();
            let id = Store.activeId();
            if (!list.length) {
                const p = blankProject();
                Store.save(p);
                list = [p];
                id = p.id;
                Store.setActive(id);
            }
            if (!id || !list.find(p => p.id === id)) {
                id = list[0].id;
                Store.setActive(id);
            }
            activeProjectId = id;
            writeForm(Store.load(id));
            renderSidebar();
            attachAutoSave();
            switchTab('project');
        }

        populateModelDropdown();
        // Hydrate from Formulize (if enabled) before reading localStorage, then init.
        Sync.pull().finally(initProjects);
    </script>
</body>
</html>
